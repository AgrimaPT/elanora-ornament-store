
<header>
    <nav class="navbar navbar-expand-lg luxury-navbar">
        <div class="container">

            <!-- Brand -->
            <a
                class="navbar-brand luxury-brand"
                href="{% url 'home' %}"
                aria-label="Elanora home"
            >
                ELANORA
            </a>

            <!-- Mobile Toggle -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation -->
            <div class="collapse navbar-collapse" id="mainNavbar">

                <!-- Main Links -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a
                            class="nav-link luxury-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                            href="{% url 'home' %}"
                            {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link luxury-nav-link {% if request.resolver_match.url_name == 'shop' or request.resolver_match.url_name == 'product_detail' %}active{% endif %}"
                            href="{% url 'shop' %}"
                            {% if request.resolver_match.url_name == 'shop' or request.resolver_match.url_name == 'product_detail' %}aria-current="page"{% endif %}
                        >
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link luxury-nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                            href="{% url 'about' %}"
                            {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}
                        >
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link luxury-nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                            href="{% url 'contact' %}"
                            {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}
                        >
                            Contact
                        </a>
                    </li>

                </ul>

                <!-- Navbar Actions -->
                <div class="navbar-actions">

                    <!-- Account -->
                    <a
                        class="navbar-icon"
                        id="account-button"
                        href="{% url 'login' %}"
                        data-profile-url="{% url 'profile' %}"
                        data-login-url="{% url 'login' %}"
                        aria-label="Login or view your account"
                        title="Account"
                    >
                        <i class="bi bi-person" aria-hidden="true"></i>
                    </a>

                    <!-- Cart -->
                    <a
                        class="navbar-icon cart-icon"
                        href="{% url 'cart' %}"
                        aria-label="Shopping cart"
                        title="Shopping cart"
                    >
                        <i class="bi bi-bag" aria-hidden="true"></i>

                        <span
                            class="cart-count"
                            id="cart-count"
                            aria-live="polite"
                            aria-atomic="true"
                        >0</span>
                    </a>

                </div>
            </div>
        </div>
    </nav>
</header>


<!-- Footer -->
<footer class="site-footer">
    <div class="container">

        <div class="row gy-5">

            <!-- Brand -->
            <div class="col-lg-4 col-md-12">
                <div class="footer-brand">

                    <a
                        href="{% url 'home' %}"
                        class="footer-logo"
                        aria-label="Elanora home"
                    >
                        ELANORA
                    </a>

                    <p class="footer-tagline">
                        The art of adornment.
                        Timeless elegance for every moment.
                    </p>

                    <!-- Add real social media URLs when available -->
                    <div class="footer-socials">
                        <a
                            href="#"
                            aria-label="Instagram"
                            title="Instagram"
                        >
                            <i class="bi bi-instagram" aria-hidden="true"></i>
                        </a>

                        <a
                            href="#"
                            aria-label="Facebook"
                            title="Facebook"
                        >
                            <i class="bi bi-facebook" aria-hidden="true"></i>
                        </a>

                        <a
                            href="#"
                            aria-label="Pinterest"
                            title="Pinterest"
                        >
                            <i class="bi bi-pinterest" aria-hidden="true"></i>
                        </a>
                    </div>

                </div>
            </div>

            <!-- Shop -->
            <div class="col-6 col-md-4 col-lg-2">
                <div class="footer-column">
                    <h3>EXPLORE</h3>

                    <a href="{% url 'shop' %}">Shop All</a>
                    <a href="{% url 'about' %}">Our Story</a>
                    <a href="{% url 'contact' %}">Contact Us</a>

            </div>

            <!-- Customer Care -->
            <div class="col-6 col-md-4 col-lg-3">
                <div class="footer-column">
                    <h3>CUSTOMER CARE</h3>

                    <a href="{% url 'contact' %}">Get in Touch</a>
                    <a href="{% url 'cart' %}">Shopping Cart</a>
                </div>
            </div>

            <!-- Account -->
            <div class="col-6 col-md-4 col-lg-3">
                <div class="footer-column">
                    <h3>YOUR ACCOUNT</h3>

                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'register' %}">Create Account</a>
                    <a href="{% url 'profile' %}">My Profile</a>
                    <a href="{% url 'orders_page' %}">My Orders</a>
                </div>
            </div>

        </div>

        <!-- Bottom -->
        <div class="footer-bottom">

            <p>
                &copy; {% now "Y" %} ELANORA. All rights reserved.
            </p>

            <a class="footer-back-to-top" href="#top">
                Back to top <span aria-hidden="true">&uarr;</span>
            </a>

        </div>

    </div>
</footer>
